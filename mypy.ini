[mypy]
python_version = 3.12
check_untyped_defs = True
disallow_untyped_defs = True

[mypy-tests.*]
disallow_untyped_defs = False

[mypy-cloud_conversations.*]
ignore_missing_imports = True

[mypy-ccauth.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-chi.*]
ignore_missing_imports = True

[mypy-blazarclient.*]
ignore_missing_imports = True

[mypy-novaclient.*]
ignore_missing_imports = True

[mypy-paramiko.*]
ignore_missing_imports = True
